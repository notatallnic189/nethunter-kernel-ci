name: Kernel build

on:
  workflow_call:
    inputs:
      device:
        description: Device directory under devices/ (empty = build all)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      device:
        description: Device directory under devices/ (empty = build all)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      devices: ${{ steps.set.outputs.devices }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: set
        env:
          DEVICE: ${{ github.event.inputs.device || inputs.device }}
        run: |
          if [ -n "$DEVICE" ]; then
            list="[\"$DEVICE\"]"
          else
            list=$(find devices -mindepth 1 -maxdepth 1 -type d -printf '"%f"\n' | jq -sc .)
          fi
          echo "devices=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.matrix.outputs.devices) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev zip jq

      - name: Build kernel + modules + AnyKernel3 zip
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          chmod +x build.sh lib/*.sh
          ./build.sh "$DEVICE"

      - name: Upload flashable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.device }}-zip
          path: |
            *.zip
            *.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect all device zips
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-zip"
          merge-multiple: true

      - name: Release on tag
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            *.zip
            *.sha256
