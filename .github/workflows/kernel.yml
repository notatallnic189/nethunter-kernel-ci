name: Kernel build

on:
  workflow_call:
    inputs:
      device:
        description: Device directory under devices/ (empty = build all)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      device:
        description: Device directory under devices/ (empty = build all)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        env:
          DEVICE: ${{ github.event.inputs.device || inputs.device }}
        run: |
          if [ -n "$DEVICE" ]; then
            list="[\"$DEVICE\"]"
          else
            list=$(find devices -mindepth 1 -maxdepth 1 -type d -printf '"%f"\n' | jq -sc .)
          fi
          echo "devices=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.matrix.outputs.devices) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev zip jq

      - name: Build kernel + modules + AnyKernel3 zip
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          chmod +x build.sh lib/*.sh
          ./build.sh "$DEVICE"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-zip
          path: |
            *.zip
            *.sha256
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.sha256
