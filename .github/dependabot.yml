version: 2
updates:
  # The workflows pin every action to a full commit SHA on purpose
  # (a repointed tag would run third-party code with a write token).
  # Dependabot turns those pins into small reviewable PRs instead of
  # leaving them to rot or to a manual tag bump.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
